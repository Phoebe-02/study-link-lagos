<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Study Link Lagos</title>
  <meta name="robots" content="noindex">
  <style>
    /* Colours live here, so you can change the theme in one place */
    :root {
      --ink: #171a20;
      --muted: #5c5e62;
      --page: #ffffff;
      --card: #f4f4f4;
      --accent: #3e6ae1;
      --accent-dark: #2f55c0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.55;
      color: var(--ink);
      background: var(--page);
    }

    header {
      background: var(--ink);
      color: #fff;
      padding: 1.25rem 1rem;
    }
    header a { color: #fff; font-weight: 700; font-size: 1.25rem; text-decoration: none; }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .box {
      width: 100%;
      max-width: 32rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--card);
      border-radius: 6px;
    }

    .code {
      margin: 0;
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    h1 { margin: 0.5rem 0; font-size: 1.5rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border-radius: 6px;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-dark); }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    header a:focus-visible { outline-color: #fff; }
  </style>
</head>
<body>
  <header>
    <a href="/">Study Link Lagos</a>
  </header>

  <main>
    <div class="box">
      <p class="code" aria-hidden="true">404</p>
      <h1>This page took a wrong turn</h1>
      <p>We could not find the page you were looking for. It may have moved, or the link may be mistyped.</p>
      <a class="btn" href="/">Back to study spots</a>
    </div>
  </main>
</body>
</html>
